name = "focuscube-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain — bind api.focuscube.app to this Worker after first deploy.
# (Set up via Cloudflare dashboard → Workers → Custom Domains, or uncomment
# the route block below once the worker exists.)
# [[routes]]
# pattern = "api.focuscube.app"
# custom_domain = true

# D1 database binding. After running `npm run db:create --workspace=@focuscube/api`,
# paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "focuscube"
database_id = "REPLACE_WITH_DATABASE_ID_FROM_WRANGLER_D1_CREATE"
migrations_dir = "migrations"

# Public env (non-secret). Secrets (OAuth client secrets, session secret) are
# set via `wrangler secret put` or the Cloudflare dashboard.
[vars]
WEB_ORIGIN = "https://focuscube.app"
ENV = "production"

[env.dev.vars]
WEB_ORIGIN = "http://localhost:5173"
ENV = "development"
